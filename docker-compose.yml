services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: hilda-postgres
    environment:
      POSTGRES_DB: hilda
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: hilda-redis
    ports:
      - "6379:6379"
    volumes:
      - ./redis-data:/data
